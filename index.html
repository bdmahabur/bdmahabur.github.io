<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC - My Website</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f7fa; color: #222; }
        nav { background: #111827; padding: 20px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-size: 16px; }
        nav a:hover { color: #60a5fa; }
        .hero {
            min-height: 80vh; display: flex; justify-content: center;
            align-items: center; text-align: center; padding: 40px 20px;
        }
        .hero h1 { font-size: 50px; margin-bottom: 15px; }
        .hero p { font-size: 20px; color: #555; margin-bottom: 25px; }
        .btn {
            display: inline-block; background: #2563eb; color: white;
            padding: 12px 25px; border-radius: 8px; text-decoration: none;
        }
        .btn:hover { background: #1d4ed8; }
        section { padding: 60px 20px; text-align: center; }
        section p { margin-top: 15px; }
        footer { text-align: center; padding: 20px; background: #111827; color: white; }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero">
        <div>
            <h1>Welcome to ABC</h1>
            <p>This is my personal GitHub Pages website.</p>
            <a href="#about" class="btn">Learn More</a>
        </div>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I am ABC. This is my website hosted using GitHub Pages.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@email.com</p>
    </section>

    <footer>
        © 2026 ABC. All rights reserved.
    </footer>
</body>
</html>
